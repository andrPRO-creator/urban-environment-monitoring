services:
  fact-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fact_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports: ["${FACT_DB_PORT:-5433}:5432"]
    volumes: [fact_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d fact_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  graph-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graph_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports: ["${GRAPH_DB_PORT:-5434}:5432"]
    volumes: [graph_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d graph_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  fact-service:
    build: ./fact-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://fact-db:5432/fact_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      GENERATOR_MIN_INTERVAL_MS: ${GENERATOR_MIN_INTERVAL_MS:-5000}
      GENERATOR_MAX_INTERVAL_MS: ${GENERATOR_MAX_INTERVAL_MS:-15000}
      GENERATOR_BATCH_SIZE: ${GENERATOR_BATCH_SIZE:-5}
      GRAPH_SERVICE_URL: http://graph-service:8082
    ports: ["${FACT_SERVICE_PORT:-8081}:8081"]
    depends_on:
      fact-db: {condition: service_healthy}
      graph-service: {condition: service_started}
  graph-service:
    build: ./graph-service
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://graph-db:5432/graph_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      FACT_SERVICE_URL: ${GRAPH_FACT_SERVICE_URL:-http://fact-service:8081}
      GRAPH_NEARBY_MINUTES: ${GRAPH_NEARBY_MINUTES:-30}
      GRAPH_NEARBY_METERS: ${GRAPH_NEARBY_METERS:-500}
    ports: ["${GRAPH_SERVICE_PORT:-8082}:8082"]
    depends_on:
      graph-db: {condition: service_healthy}
volumes:
  fact_data:
  graph_data:
